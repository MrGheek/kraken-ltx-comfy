name: build-ltx-image

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (use a large/self-hosted runner; the image is ~40GB)"
        required: false
        default: ubuntu-latest
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners have ~14GB free. This frees more, but a ~40GB
      # image still needs a larger/self-hosted runner.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LTX-2.5 ComfyUI worker for Kraken Studios

      - name: Make package public (only if the LTX license permits redistribution)
        if: false
        run: |
          echo "Intentionally disabled: LTX-2.5 weights are gated. Keep the package private unless the LICENSE permits redistribution."
